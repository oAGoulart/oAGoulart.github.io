<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pietra</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Pixelify Sans", sans-serif;
    }
    .petal {
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.2s ease-out;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-yellow-50 via-yellow-100 to-amber-50 min-h-screen text-gray-800 relative flex items-center justify-center p-6 selection:bg-pink-200 selection:text-pink-900">
  <main class="w-full max-w-2xl p-2 sm:p-4 flex flex-col items-center text-center">
    <div class="relative group">
      <img
        src="media/hk.gif"
        alt="Hello Kitty"
        class="relative w-40 h-40 sm:w-48 sm:h-48">
    </div>
    <h1 class="mt-6 text-2xl sm:text-4xl text-gray-900">
      Pietra
    </h1>
    <p class="mt-4 text-lg sm:text-xl text-gray-700 max-w-md mx-auto leading-relaxed">
      “Eu acredito que nas sextas-feiras, garotas bonitas viram feiticeiras” 🌹
    </p>
    <div class="w-16 h-1 bg-pink-300 rounded-full mt-4 mb-6"></div>
    <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
      <a href="#" id="bloom-btn" class="px-8 py-3 bg-pink-200 hover:bg-pink-300 text-pink-950 rounded-xl shadow-sm hover:shadow-md transition-all transform hover:-translate-y-1 text-center border border-pink-300">
        [ Surpresa! ]
      </a>
      <a href="#" class="px-8 py-3 bg-white hover:bg-yellow-50 text-gray-800 rounded-xl shadow-sm hover:shadow-md transition-all transform hover:-translate-y-1 text-center border-2 border-pink-200">
        [ Contato ]
      </a>
    </div>
    <div class="mt-8 flex space-x-4 text-sm">
      <a href="#" class="text-gray-500 hover:text-pink-600 transition-colors border-b border-transparent hover:border-pink-600 pb-1">GitHub</a>
      <a href="#" class="text-gray-500 hover:text-pink-600 transition-colors border-b border-transparent hover:border-pink-600 pb-1">LinkedIn</a>
      <a href="https://www.instagram.com/pietra_brito.c/" target="_blank" class="text-gray-500 hover:text-pink-600 transition-colors border-b border-transparent hover:border-pink-600 pb-1">Instagram</a>
    </div>
  </main>
  <script>
    const button = document.getElementById('bloom-btn');
    button.addEventListener('click', (e) => {
      const rect = button.getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;
      const numPetals = 16;
      for (let i = 0; i < numPetals; i++) {
        const petal = document.createElement('img');
        petal.src = 'media/lilium.png';
        petal.className = 'petal fixed pointer-events-none z-50 left-0 top-0 opacity-100 origin-bottom w-8 h-12 object-contain drop-shadow-md';
        petal.style.transform = `translate(${originX - 32}px, ${originY - 32}px) scale(0.2) rotate(0deg)`;
        document.body.appendChild(petal);
        const angle = (Math.PI * 2 * i) / numPetals + (Math.random() * 0.5 - 0.25);
        const velocity = Math.random() * 150 + 100;
        const tx = originX - 16 + Math.cos(angle) * velocity;
        const ty = originY - 24 + Math.sin(angle) * velocity - (Math.random() * 50 + 50);
        const rotation = Math.random() * 720 - 360;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            petal.style.transform = `translate(${tx}px, ${ty + 100}px) scale(1) rotate(${rotation}deg)`;
            petal.style.opacity = '0';
          });
        });
        setTimeout(() => {
          petal.remove();
        }, 1200);
      }
    });
  </script>
</body>
</html>
